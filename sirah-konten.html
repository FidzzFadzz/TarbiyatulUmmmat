<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konten Sirah - Aplikasi Islami</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-white min-h-screen overflow-x-hidden">
    <div class="max-w-md mx-auto">

        <!-- Header -->
        <div class="px-5 pt-8 pb-4 flex items-center justify-between" style="background-color: #405957;">
            <a href="javascript:void(0)" onclick="navigateBack('sirah-sub.html')" class="text-white transition active:scale-95">
                <i class="fas fa-arrow-left text-lg"></i>
            </a>
            <h1 class="text-base font-bold text-white" id="pageTitle">Nabi Adam Alaihis Salam</h1>
            <div class="w-6"></div>
        </div>

        <!-- Tab Switch -->
        <div class="px-5 py-4">
            <div class="flex bg-gray-100 rounded-full p-1">
                <button id="tabBuku" onclick="switchTab('buku')" class="flex-1 py-2 rounded-full text-sm font-semibold text-white transition-all flex items-center justify-center gap-2" style="background-color: #405957;">
                    <i class="fas fa-book text-xs"></i> Buku
                </button>
                <button id="tabVideo" onclick="switchTab('video')" class="flex-1 py-2 rounded-full text-sm font-semibold text-gray-400 transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-video text-xs"></i> Video
                </button>
            </div>
        </div>

        <!-- Empty State -->
        <div class="flex flex-col items-center justify-center px-5 mt-16">
            <div class="mb-6">
                <img src="asset/Folder-kosong.png" alt="Belum Tersedia" class="w-32 h-32 object-contain">
            </div>
            <p class="text-gray-500 font-semibold text-center text-sm">Belum Tersedia</p>
            <p class="text-gray-400 text-center text-sm mt-1">Insyaallah Segera Hadir</p>
        </div>

    </div>

    <script src="js/transition.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const nabi = params.get('nabi');

        const nabiNames = {
            'adam': 'Nabi Adam Alaihis Salam',
            'idris': 'Nabi Idris Alaihis Salam',
            'nuh': 'Nabi Nuh Alaihis Salam',
            'hud': 'Nabi Hud Alaihis Salam',
            'shaleh': 'Nabi Shaleh Alaihis Salam',
            'ibrahim': 'Nabi Ibrahim Alaihis Salam',
            'ismail': 'Nabi Ismail Alaihis Salam',
            'muhammad': 'Nabi Muhammad Shallallahu Alaihi Wasallam'
        };

        if (nabi && nabiNames[nabi]) {
            document.getElementById('pageTitle').textContent = nabiNames[nabi];
        }

        function switchTab(tab) {
            const tabBuku = document.getElementById('tabBuku');
            const tabVideo = document.getElementById('tabVideo');
            if (tab === 'buku') {
                tabBuku.style.backgroundColor = '#405957';
                tabBuku.classList.replace('text-gray-400', 'text-white');
                tabVideo.style.backgroundColor = '';
                tabVideo.classList.replace('text-white', 'text-gray-400');
            } else {
                tabVideo.style.backgroundColor = '#405957';
                tabVideo.classList.replace('text-gray-400', 'text-white');
                tabBuku.style.backgroundColor = '';
                tabBuku.classList.replace('text-white', 'text-gray-400');
            }
        }
    </script>

</body>
</html>
